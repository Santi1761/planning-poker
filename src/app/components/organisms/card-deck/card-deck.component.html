<div class="deck-container">

  <h3 class="deck-title">Elige una carta 👇</h3>

  @if (isLoading()) {
    <div class="loading-state">Repartiendo cartas...</div>
  }

  @if (!isLoading() && cards().length === 0) {
    <div class="empty-state">No hay cartas registradas</div>
  }

  @if (!isLoading() && cards().length > 0) {
    <div class="cards-row">
      @for (card of cards(); track card) {
        <app-score-card
          [value]="card"
          [isSelected]="selectedCard() === card"
          (click)="onSelect(card)">
        </app-score-card>
      }
    </div>
  }

</div>

<div class="board-container">
  <header class="board-header">
    <div class="header-left">
      <img src="logo-poker.png" alt="Logo" class="logo">
    </div>

    <div class="header-center">
      <h1 class="sprint-title">{{ gameName }}</h1>
    </div>

    <div class="header-right">
      <div class="view-mode-toggle">
        <span [class.active]="userViewMode === 'espectador'">Espectador</span>
        <label class="switch">
          <input type="checkbox" [checked]="userViewMode === 'jugador'" (change)="toggleViewMode()">
          <span class="slider round"></span>
        </label>
        <span [class.active]="userViewMode === 'jugador'">Jugador</span>
      </div>

      <div class="user-badge">{{ userInitials }}</div>
      <button class="invite-btn" (click)="openInviteModal()">Invitar jugadores</button>
    </div>
  </header>

  <main class="board-main" style="position: relative;">
    <app-poker-table [players]="mockPlayers" [isRevealed]="isRevealed"></app-poker-table>

    <ng-container *ngIf="userRole === 'propietario'">

      <button
        class="reveal-btn"
        *ngIf="!isRevealed"
        (click)="revealCards()">
        Revelar cartas
      </button>

      <button
        class="reveal-btn"
        *ngIf="isRevealed"
        (click)="restartGame()">
        Nueva votación
      </button>

    </ng-container>
  </main>

  <footer class="board-footer">
    <app-card-deck
      *ngIf="userViewMode === 'jugador' && !isRevealed"
      (cardSelected)="onCardSelected($event)">
    </app-card-deck>

    <app-vote-summary
      *ngIf="isRevealed"
      [players]="mockPlayers">
    </app-vote-summary>
  </footer>

  <app-invite-modal
    *ngIf="isModalOpen"
    [gameId]="gameId"
    (close)="closeInviteModal()">
  </app-invite-modal>

</div>

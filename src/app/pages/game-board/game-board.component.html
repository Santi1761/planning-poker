<div class="board-container">
  <header class="board-header">
    <div class="header-left">
      <img src="logo-poker.png" alt="Logo" class="logo">
    </div>

    <div class="header-center">
      <h1 class="sprint-title">{{ gameName() }}</h1>
    </div>

    <div class="header-right">
      <div class="view-mode-toggle">
        <span [class.active]="userViewMode() === 'espectador'">Espectador</span>
        <label class="switch">
          <input type="checkbox" [checked]="userViewMode() === 'jugador'" (change)="toggleViewMode()">
          <span class="slider round"></span>
        </label>
        <span [class.active]="userViewMode() === 'jugador'">Jugador</span>
      </div>

      <div class="user-badge">{{ userInitials() }}</div>

      @if (userRole() === 'propietario') {
        <button class="invite-btn" (click)="openInviteModal()">Invitar jugadores</button>
      }
    </div>
  </header>

  <main class="board-main" style="position: relative;">
    <app-poker-table
      [players]="mockPlayers()"
      [isRevealed]="isRevealed()"
      (playerClicked)="makeAdmin($event)">
    </app-poker-table>

    @if (userRole() === 'propietario') {
      @if (!isRevealed()) {
        <button class="reveal-btn" (click)="revealCards()">Revelar cartas</button>
      }
      @if (isRevealed()) {
        <button class="reveal-btn" (click)="restartGame()">Nueva votación</button>
      }
    }
  </main>

  <footer class="board-footer">
    @if (userViewMode() === 'jugador' && !isRevealed()) {
      <app-card-deck (cardSelected)="onCardSelected($event)"></app-card-deck>
    }
    @if (isRevealed()) {
      <app-vote-summary [players]="mockPlayers()"></app-vote-summary>
    }
  </footer>

  @if (isModalOpen()) {
    <app-invite-modal [gameId]="gameId()" (close)="closeInviteModal()"></app-invite-modal>
  }
</div>
